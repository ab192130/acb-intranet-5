        <li><b>Görünüş linzası.</b> "Mənim / Komanda / Departament" — eyni data, rol üzrə fərqli pəncərə. Bu, icazə deyil.</li>
        <li><b>Inbox aqreqasiyası.</b> Mənbə üzrə say göstərilir, məzmun açılmır — diqqət büdcəsi qorunur.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">02</span><h3>Günü balanslaşdır</h3>

      <svg class="frame" viewBox="0 0 1440 900" data-frame="plan"></svg>
      <ol class="notes">
        <li><b>Default olaraq söndürülüb.</b> Heç bir təklif avtomatik tətbiq olunmur — istifadəçi seçir.</li>
        <li><b>Hər təklifin səbəbi var.</b> İzahsız tövsiyə qara qutu kimi qəbul edilir və rədd olunur.</li>
        <li><b>Geri qaytarıla bilər.</b> Geri alınmayan avtomatlaşdırma bu məhsulda yoxdur.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">02b</span><h3>Təsdiq və təhvil növbəsi</h3>
        <span class="purpose">Mənim növbəm ↔ gözləyirəm · qərar inline açılır, xəbərdarlıq yığılır</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="approvals"></svg>
      <ol class="notes">
        <li><b>Təsdiq status deyil.</b> Ayrıca qərar obyektidir: kimin növbəsi, hansı artefakt, hansı SLA. Status work item-in harada olduğunu deyir; gate kimin qərar verdiyini.</li>
        <li><b>Təsdiq versiyaya bağlanır.</b> Qərar “Refund axını · v3”ə verilir. Fayl dəyişsə, köhnə təsdiq etibarsız olur və yenidən təsdiq tələb olunur.</li>
        <li><b>Üç nəticə var.</b> Təsdiq, düzəliş istə, rədd. “Düzəliş istə” ölü son deyil — iş əvvəlki mərhələyə qayıdır və rework sayılır. Şərti təsdiq ayrıca haldır: şərt yazılır və qəbul meyarına çevrilir.</li>
        <li><b>Rəy bloklamır.</b> Consult (rəy) və decide (təsdiq) ayrıdır; rəy istənilən iş “mənim növbəm”də qərar kimi görünmür.</li>
        <li><b>Delegasiya görünür.</b> Məzuniyyətdə olan təsdiqçinin işi müvəqqəti keçir, kimə keçdiyi və nə vaxt bitdiyi yazılır; səssiz ötürmə yoxdur və geri alına bilir.</li>
        <li><b>Vakant rol = yetim gate.</b> Rol boşdursa qərar heç kimin növbəsində deyil; sistem bunu accent ilə göstərir və əvəzedici təyin etməyi tələb edir.</li>
        <li><b>Hesabsız alıcı.</b> Xarici müştəri üçün hesab yaradılmır: vaxtı məhdud linklə qəbul edir. Person ≠ User prinsipi qorunur.</li>
        <li><b>Sürət tək ölçü deyil.</b> Orta təsdiq müddəti yanında rework dərəcəsi göstərilir — yalnız sürət hədəfi formal təsdiqi təşviq edər.</li>
        <li><b>Avtomatlaşdırma qərar vermir.</b> Sistem yalnız xatırladır və eskalasiya edir; hər hərəkətin səbəbi, jurnalı və “geri al”ı var.</li>
      </ol>
    </figure>

    wait.forEach(function (w, k) {

      if (k < 4) f.line(724, wy + 52, 1340, wy + 52, { color: C.line, dash: [4, 6], sw: 1 });

    /* axın sağlamlığı — sürət + keyfiyyət birlikdə */

})();

<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: #board, #today, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
