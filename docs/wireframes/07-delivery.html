  <section class="section">
    <div class="section-head">
      <span class="idx">07</span><h2>Buraxılış</h2>
      <span class="sub">tələb · bölgü · paket · milestone · qapı · mərhələ</span>
    </div>

    <figure>
      <div class="frame-head"><span class="num">12</span><h3>Tələb və bölgü</h3>
        <span class="purpose">PMO inputu tələb kimi qeydə alınır; triage və bölgü work item-ları yaradır</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="release-intake"></svg>
      <ol class="notes">
        <li><b>PMO inputu task deyil, tələbdir.</b> E-mail və ya mesaj birbaşa işə çevrilmir: əvvəl tələb qeydə alınır, sonra triage olunur. Bu, “kim istədi, nə vaxt, nə üçün” izini saxlayır.</li>
        <li><b>Triage qapıdır.</b> Lead qəbul edir, məlumat istəyir və ya rədd edir. Qəbul olunmamış tələb work item yaratmır — boş iş yükü yaranmır.</li>
        <li><b>Qəbul meyarları müqavilədir.</b> Nəyin “hazır” sayılacağı tələb səviyyəsində yazılır; sonradan “bu deyildi” mübahisəsi qalmır.</li>
        <li><b>Bölgü iş vahidləri yaradır.</b> Lead tələbi feature, bug və ya alt task-lara bölür; hər birinin sahibi, qiyməti və statusu olur.</li>
        <li><b>Paket tələbdən avtomatik yaranmır.</b> Yalnız qəbul edilmiş işlər paketə düşür; paket kimin, nəyi, hansı mərhələyə göndərdiyini bilir.</li>
        <li><b>Kontekst itmir.</b> Tələb, work item və paket bir-birinə bağlıdır; PMO sonradan “bizim tələb hara düşdü?” sualına bir kliklə cavab tapır.</li>
        <li><b>Design şərti asılılıqdır.</b> Default söndürülüb; yalnız lazım olanda work item-ə xarici asılılıq kimi əlavə olunur. Ayrı departament, design work item və ya daimi mərhələ yaradılmır.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">13</span><h3>Paket — yoxlama qapıları</h3>
        <span class="purpose">Paket mərhələlər arasında hərəkət edir; hər keçid qərar, sübut və SLA tələb edir</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="release-package"></svg>
      <ol class="notes">
        <li><b>Paket əsas vahiddir.</b> QA tək-tək work item-ə yox, paketin konkret versiyasına baxır. Bir paketdə 4 iş ola bilər; qərar hamısına aiddir.</li>
        <li><b>Mərhələ status deyil.</b> Work item “Done” ola bilər, paket isə hələ yoxlamada qala bilər. Bu iki vəziyyət ayrı saxlanılır.</li>
        <li><b>Hər qapının sahibi var.</b> Texniki baxış, ilkin yoxlama və QA qapıları ayrı-ayrı qərar nöqtələridir; “OK” sözü qərar sayılmır.</li>
        <li><b>Sübut tələb olunur.</b> Checklist, test nəticəsi, link və ya fayl — qərarın əsası görünməlidir. Sübutsuz təsdiq auditdə boş görünür.</li>
        <li><b>Keçid manual ola bilər.</b> Sistem heç bir aləti işə salmır; yalnız “bu paket bu mərhələyə keçdi” qeydini saxlayır. Mənbə linki opsionaldır.</li>
        <li><b>Qərar jurnalı dəyişməzdir.</b> Kim, nə vaxt, hansı paket versiyasına və hansı sübutla qərar verdi — hamısı qalır. Düzəliş varsa, yeni qeyd yaranır.</li>
        <li><b>Düzəliş dövrəsi görünür.</b> QA “düzəliş istə” verəndə paket əvvəlki mərhələyə qayıdır; bu, itmir və rework kimi sayılır.</li>
        <li><b>Milestone ilə əlaqə opsionaldır.</b> Paket bir və ya bir neçə milestone-a xidmət edə bilər; hotfix milestonesuz ola bilər. Milestone tarixi biznes öhdəliyidir, paketin qapı SLA-ı isə ayrıdır.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">14</span><h3>Buraxılış lövhəsi</h3>
        <span class="purpose">Bütün paketlər mərhələlər üzrə; WIP, gecikmə və bloklar bir baxışda</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="release-board"></svg>
      <ol class="notes">
        <li><b>Lövhə paketləri göstərir.</b> Work item-lar paketin içindədir; lövhədə tək-tək task-lar yox, yoxlanıla bilən paketlər hərəkət edir. Kartdaki qısa etiket paketin bağlı olduğu milestone-u göstərir (məs. `3DS`).</li>
        <li><b>WIP və yaş görünür.</b> Hər sütunda neçə paket olduğu və neçə gündür gözlədiyi göstərilir; “hamısı işləyir” illüziyası yox olur.</li>
        <li><b>Blok səbəbi ilə göstərilir.</b> Gecikən paket accent ilə işarələnir və səbəb yazılır — sadəcə qırmızı rəng deyil.</li>
        <li><b>Manual keçid görünür.</b> Sistem deploy etmir; keçid qeydə alınır. “Manual” badge-i bunu açıq deyir.</li>
        <li><b>Lövhə status redaktoru deyil.</b> Kartı sürüşdürmək qərar vermir; klik paketi açır və qapı orada tamamlanır.</li>
        <li><b>Keçidlər jurnalda.</b> Hər mərhələ dəyişikliyi kim, nə vaxt və hansı səbəblə qeydə alınır. Bu, “sistem özü deploy etdi” illüziyasını yaratmır.</li>
        <li><b>Milestone filtri.</b> Lövhə paketləri milestone üzrə süzür; milestone ayrı sütun deyil — paketin plan öhdəliyidir, paket isə onun yoxlama vahididir.</li>
      </ol>
    </figure>

  function stageRail(f, y, stages) {
    var x0 = 180, gap = 200;
    f.line(x0, y, x0 + gap * (stages.length - 1), y, { color: C.line, sw: 1.4 });

    stages.forEach(function (s, i) {
      var cx = x0 + i * gap;
      if (s.state === 'done') {
        f.line(x0, y, cx, y, { color: C.ink2, sw: 1.4 });
        f.circle(cx, y, 22, { fill: C.ink, stroke: C.ink, rough: 0.6 });
        f.line(cx - 5, y, cx - 1, y + 4, { color: C.white, sw: 1.5 });
        f.line(cx - 1, y + 4, cx + 6, y - 4, { color: C.white, sw: 1.5 });
      } else if (s.state === 'now') {
        f.circle(cx, y, 26, { fill: C.white, stroke: C.accent, sw: 1.6, rough: 0.6 });
        f.dot(cx, y, 4, C.accent);
      } else {
        f.circle(cx, y, 20, { fill: C.white, stroke: C.faint, sw: 1.4, dash: [3, 3], rough: 0.6 });
      }
      f.text(cx, y + 34, s.name, {
        size: 11.5, anchor: 'middle',
        weight: s.state === 'now' ? 700 : 400,
        color: s.state === 'next' ? C.faint : C.ink
      });
      f.text(cx, y + 50, s.date || '—', {
        size: 9.5, anchor: 'middle',
        color: s.state === 'now' ? C.accent : C.faint
      });
    });
  }

  function checklist(f, x, y, items) {
    items.forEach(function (it, k) {
      var cy = y + k * 22;
      f.check(x, cy - 12, it[1]);
      f.text(x + 26, cy, it[0], {
        size: 11, color: it[1] ? C.ink2 : C.ink
      });
      if (!it[1]) f.text(x + 520, cy, it[2] || 'çatışmır', {
        size: 9, color: C.accent, anchor: 'end'
      });
    });
  }

<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: #release-intake, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
