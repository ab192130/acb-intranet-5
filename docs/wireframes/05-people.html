    </div>

    <figure>
      <div class="frame-head"><span class="num">09</span><h3>Kataloq</h3>
        <span class="purpose">Kart şəbəkəsi — şəxs = kart, tək toolbar</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="people"></svg>
      <ol class="notes">
        <li><b>Cədvəl → kart.</b> Sütun başlığı və sətir zolağı yoxdur; hər şəxs bir kartdır. Ad, rol, şöbə və "nə üçün" bir baxışda oxunur.</li>
        <li><b>Tək toolbar, iki şöbə çipi.</b> Axtarış, Hamısı ↔ Rəqəmsallaşdırma, rol və sıralama bir sıradadır; digər şöbələr kataloqda görünür.</li>
        <li><b>Hover — hərəkət kartın üstündə.</b> "Profil aç" və sürətli əməliyyat yalnız hover/fokusda görünür; kartın özü keçiddir.</li>
        <li><b>Hesabı olmayan şəxs neytraldır.</b> "Hesab yoxdur" xəbərdarlıq deyil — Person ≠ User; kataloqda qalır və işə təyin oluna bilər.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">10</span><h3>Şəxs profili</h3>
        <span class="purpose">Rol, layihələr, açıq işlər, məlumatın təzəliyi</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="person"></svg>
      <ol class="notes">
        <li><b>Person ≠ User.</b> Hesabı olmayan şəxs də kataloqdadır və işə təyin oluna bilər — modelin əsası budur.</li>
        <li><b>"Son yoxlanıldı".</b> Əl ilə saxlanan məlumatın təzəliyini göstərir; köhnə profil səssiz qalmır.</li>
        <li><b>Layihə rolu ayrıca.</b> Lead / Contributor — vəzifə ilə qarışdırılmır.</li>
      </ol>
    </figure>
  </section>

<script>
/* 05 People — inline frames: kart kataloqu + profil */
(function () {
  'use strict';
  var WF = window.WF, C = WF.C;
  var frames = WF.frames;

  /* =========================== 9. KATALOQ =========================== */
  frames.people = function (f) {
    WF.shell(f, { crumb: 'İnsanlar', active: 3, search: false });

    /* title */
    f.text(100, 122, 'İnsanlar', { size: 28, weight: 700 });
    f.chip(238, 98, '68', { h: 24, w: 42, size: 11.5 });

    /* one toolbar: search + department (v1: all vs ours) + role | sort */
    f.input(100, 148, 300, 'Ad, rol, bacarıq axtar…', { h: 32 });

    f.chip(412, 148, 'Hamısı 68', { active: true, h: 32, w: 80, size: 11.5 });
    f.chip(498, 148, 'Rəqəmsallaşdırma 18', { h: 32, w: 146, size: 11.5 });
    f.chip(650, 148, 'Rol ▾', { h: 32, w: 64, size: 11.5 });

    /* sort sits at the right edge of the same row */
    f.chip(1190, 148, 'Sırala: Əlifba ▾', { h: 32, w: 130, size: 11.5 });

    var cardW = 290, cardH = 286, gap = 20, gridX = 100, gridY = 208;

    function personCard(p, cx, cy) {
      var team = p[5], hasAccount = p[8];

      f.rrect(cx, cy, cardW, cardH, 8, { fill: C.white });

      /* cover: avatar stands in for the photo, badges sit on top */
      f.rrect(cx, cy, cardW, 120, 8, { fill: C.fill2, stroke: 'none', rough: 0.6 });
      f.plainRect(cx, cy + 112, cardW, 8, C.fill2);

      f.text(cx + 16, cy + 24, p[3], { size: 9, color: C.faint, ls: 1.3 });
      if (hasAccount) {
        f.dot(cx + cardW - 62, cy + 20, 2.8, C.accent);
        f.text(cx + cardW - 16, cy + 24, 'sistemdə', { size: 9.5, color: C.ink2, anchor: 'end' });
      } else {
        f.text(cx + cardW - 16, cy + 24, 'hesab yoxdur', { size: 9.5, color: C.faint, anchor: 'end' });
      }

      f.av(cx + 44, cy + 70, 26, p[0]);

      /* identity */
      f.text(cx + 16, cy + 150, p[1], { size: 14.5, weight: 700 });
      f.text(cx + 16, cy + 172, p[2], { size: 11.5, color: C.ink2 });
      f.text(cx + 16, cy + 198, '“' + p[4] + '”', { size: 11.5 });

      /* meta: project team + freshness */
      f.line(cx + 16, cy + 218, cx + cardW - 16, cy + 218, { color: C.line, dash: [3, 5], sw: 1 });
      if (team.length) {
        var end = f.avstack(cx + 16, cy + 244, team, 8);
        f.text(end + 4, cy + 248, p[6], { size: 10.5, color: C.ink2 });
      } else {
        f.text(cx + 16, cy + 248, '— layihə', { size: 10.5, color: C.faint });
      }
      f.text(cx + cardW - 16, cy + 248, p[7], { size: 10.5, color: C.faint, anchor: 'end' });
    }

    /* card = one person; 4×2 visible, the rest behind "load more" */
    var people = [
      ['BA', 'Burhan Ağazadə', 'Product Engineer', 'RƏQƏMSALLAŞDIRMA', 'Sistem sahibi, prioritetlər', ['SƏ', 'RQ', 'LN'], '6 layihə', 'bu gün', true],
      ['SƏ', 'Sevil Əliyeva', 'Project Lead', 'ÖDƏNİŞ', 'Layihə statusu, bloklar', ['BA', 'NH', 'EC'], '3 layihə', '2 saat', true],
      ['AM', 'Anar Məmmədov', 'Rəqəmsallaşdırma rəhbəri', 'RƏQƏMSALLAŞDIRMA', 'Təsdiq, büdcə, eskalasiya', [], '— layihə', 'bu gün', true],
      ['NH', 'Nigar Həsənli', 'QA Engineer', 'ÖDƏNİŞ', 'Test, bug triaj', ['SƏ', 'EC'], '2 layihə', 'dünən', true],
      ['RQ', 'Rəşad Quliyev', 'Business Analyst', 'DATA', 'Tələblər, use case', ['BA', 'LN'], '2 layihə', 'dünən', true],
      ['EC', 'Elvin Cəfərov', 'Backend Developer', 'ÖDƏNİŞ', '3DS, gateway inteqrasiyası', ['SƏ', 'NH', 'Tİ'], '3 layihə', '3 gün', true],
      ['LN', 'Leyla Nəsirova', 'Product Designer', 'MƏHSUL', 'UX, prototip, dizayn sistemi', ['BA'], '1 layihə', '5 gün', true],
      ['AQ', 'Aysel Quliyeva', 'Mühasib', 'MALİYYƏ', 'Büdcə, hesab-faktura', [], '— layihə', 'kataloqda', false]
    ];
    people.forEach(function (p, i) {
      personCard(p, gridX + (i % 4) * (cardW + gap), gridY + Math.floor(i / 4) * (cardH + gap));
    });

    /* hover state on card 2: border + actions replace the meta line */
    var hx = gridX + cardW + gap, hy = gridY;
    f.rrect(hx, hy, cardW, cardH, 8, { fill: 'none', stroke: C.accent, sw: 2.2 });
    f.plainRect(hx + 6, hy + 230, cardW - 12, 46, C.white, 0.97);
    f.btn(hx + 16, hy + 238, 120, 'Profil aç', { kind: 'primary', h: 30, size: 11.5 });
    f.btn(hx + cardW - 48, hy + 238, 30, '···', { h: 30, size: 11.5 });

    /* feed footer */
    f.text(100, 842, '68 nəfər · 20 sistem istifadəçisi · kataloqu 2 nəfər saxlayır', { size: 11.5, color: C.faint });
    f.btn(1154, 820, 166, 'Daha çox göstər', { h: 34, size: 12, kind: 'ghost' });

    f.annoS(1, 86, 196);
    f.annoS(2, 540, 192);
    f.annoS(3, hx + cardW - 14, hy + 100);
    f.annoS(4, 1228, 540);
  };

  /* ============================ 10. PROFİL ============================ */
  frames.person = function (f) {
    WF.shell(f, { crumb: 'İnsanlar / B. Ağazadə', active: 3 });

    f.text(100, 94, '← İnsanlar', { size: 12, color: C.ink2 });
    f.av(150, 168, 38, 'BA');
    f.text(208, 158, 'Burhan Ağazadə', { size: 26, weight: 700 });
    f.text(208, 184, 'Product Engineer · Rəqəmsallaşdırma', { size: 13.5, color: C.ink2 });
    f.chip(208, 196, 'Sistemdə aktiv', { h: 26, w: 122, size: 11.5 });
    f.chip(340, 196, '6 layihə', { h: 26, w: 82, size: 11.5 });

    f.text(1152, 150, 'Profil son yoxlanıldı: 12 okt', { size: 11, color: C.faint, anchor: 'end' });
    f.btn(1236, 166, 104, 'Redaktə et', { h: 32, size: 11.5, kind: 'ghost' });

    /* left column */
    f.card(100, 240, 520, 150, 'Nə ilə məşğuldur');
    f.plines(120, 286, 480, 3, 24);

    f.card(100, 406, 520, 150, 'Nə üçün müraciət etməli');
    f.chip(120, 444, '3DS / ödəniş axını', { h: 26, w: 150, size: 11 });
    f.chip(280, 444, 'Sistem prioritetləri', { h: 26, w: 158, size: 11 });
    f.chip(120, 480, 'Data modeli', { h: 26, w: 104, size: 11 });
    f.text(120, 532, 'Bu sahələrdə qərar verən şəxs.', { size: 11, color: C.faint });

    f.card(100, 572, 520, 130, 'Bacarıqlar');
    f.chip(120, 606, 'Product', { h: 26, w: 82, size: 11 });
    f.chip(210, 606, 'Systems design', { h: 26, w: 124, size: 11 });
    f.chip(342, 606, 'Payment domain', { h: 26, w: 134, size: 11 });
    f.chip(120, 642, 'SQL', { h: 26, w: 56, size: 11 });
    f.chip(184, 642, 'Figma', { h: 26, w: 66, size: 11 });

    /* right column */
    f.card(640, 240, 700, 210, 'Layihələr (3)', 'Hamısı');
    [['Ödəniş gateway', 'Lead', ['SƏ', 'BA', 'NH']],
     ['3DS inteqrasiyası', 'Contributor', ['BA', 'EC']],
     ['Data platform', 'Contributor', ['RQ', 'Tİ']]].forEach(function (p, k) {
      var py = 306 + k * 54;
      f.text(660, py, p[0], { size: 13 });
      f.chip(880, py - 15, p[1], { h: 22, w: p[1] === 'Lead' ? 52 : 84, size: 10 });
      f.avstack(1180, py - 6, p[2], 9);
      if (k < 2) f.line(660, py + 24, 1320, py + 24, { color: C.line, dash: [4, 6], sw: 1 });
    });

    f.card(640, 466, 700, 210, 'Açıq işlər (4)', 'Hamısı');
    [['ACB-142', '3DS redirect döngüsü', 'İcrada', '30 okt'],
     ['ACB-160', 'Refund API kontraktı', 'Todo', '2 noy'],
     ['ACB-155', 'Webhook imzası', 'Review', '4 noy']].forEach(function (w, k) {
      var wy = 532 + k * 54;
      f.text(660, wy, w[0], { size: 11, color: C.faint });
      f.text(730, wy, w[1], { size: 12.5 });
      f.chip(1060, wy - 15, w[2], { h: 22, w: 62, size: 10 });
      f.text(1320, wy, w[3], { size: 11, color: C.faint, anchor: 'end' });
      if (k < 2) f.line(660, wy + 24, 1320, wy + 24, { color: C.line, dash: [4, 6], sw: 1 });
    });

    f.text(640, 720, 'Hesabı olmayan 48 nəfər də kataloqdadır — Person ≠ User.', { size: 11, color: C.faint });

    f.annoS(1, 436, 208);
    f.annoS(2, 1012, 150);
    f.annoS(3, 782, 268);
  };
})();
</script>
<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: #board, #today, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
</body>
