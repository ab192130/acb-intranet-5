    <figure>
      <div class="frame-head"><span class="num">05</span><h3>Sənəd — ümumi baxış</h3>
        <span class="purpose">Sərbəst mətn: başlıqlar, paraqraflar, tipli istinadlar</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="document"></svg>
      <ol class="notes">
        <li><b>Sərbəst mətn qəsdən strukturlaşdırılmır.</b> Hər sənəd eyni sahələrə sığmır; başlıq və paraqraf oxunan mətn üçün kifayətdir, sahə cədvəli isə onu süni şəkildə bölərdi.</li>
        <li><b>Tipli istinad mətnin içindədir.</b> UC-04 və payment_tx çipləri sərbəst link deyil — tipi bilinir, ona görə resursun nəyə bağlı olduğu və dəyişikliyin təsiri oxuyarkən görünür.</li>
        <li><b>Mündəricat sağdadır.</b> Uzun mətnin oxu eni daralmır; başlıqlar arasında keçid isə həmişə əlçatan qalır.</li>
        <li><b>Versiyalar və şərhlər kontekstdədir.</b> Sağ relsdə qalırlar — oxumağı kəsmir, müqayisə və müzakirə ayrıca ekrana çıxmır.</li>
      </ol>
    </figure>

      </ol>

<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: #board, #today, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
