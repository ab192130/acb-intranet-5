  <section class="section">

      <span class="idx">02</span><h2>Projects</h2>
      <span class="sub">nested layihələr · work items · icma görünüşü</span>
    </div>

    <figure>
      <div class="frame-head"><span class="num">03</span><h3>Layihə icmalı</h3>
        <span class="purpose">Cover + icon, status/health, progress, milestone, komanda və fəaliyyət qatı</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="project"></svg>
      <ol class="notes">
        <li><b>Nested layihələr ağacda.</b> Alt layihə gizlədilmir — dərinlik vizual olaraq görünür (bənd 2).</li>
        <li><b>Owner və Lead ayrıdır.</b> Owner məsuliyyət, Lead icra — eyni adam ola bilər, anlayış fərqlidir (bənd 5).</li>
        <li><b>Alt layihələr kart kimi.</b> İrəliləyiş + komanda bir baxışda; içinə girmədən vəziyyət oxunur.</li>
        <li><b>Fəaliyyət + versiya.</b> Snapshot işarələri generic audit qatından gəlir, hər modula ayrıca yazılmır (bənd 12).</li>
        <li><b>Status və health ayrıdır.</b> Status lifecycle-dir (Aktiv); health törəyən siqnaldır (Sağlam). Növbəti milestone ayrıca göstərilir; Bitdi + Bloklanıb kimi ziddiyyət yaranmır.</li>
        <li><b>Resurslar sağ relsdə.</b> Üç tip (sənəd, use case, data dictionary) xülasə kimi; tam siyahı Resources tabındadır.</li>
        <li><b>Layihə haqqında inline redaktə olunur.</b> Mətnə klik → textarea; autosave debounce 800ms.</li>
        <li><b>Layihə ikonu.</b> Klik → emoji picker; seçim ikonu dəyişir, “Sil” ikonu çıxarır. Seçilmiş ikon sol ağacda layihə sətrində də görünür. State: <code>03c</code>.</li>
        <li><b>Cover.</b> Notion üslubu; “Dəyişdir” → gradient / upload / link, “Sil” coveri çıxarır.</li>
        <li><b>Layihə actionları breadcrumb row-undadır.</b> Kiçik `Work item yarat` + `···` menyu (Redaktə et, Paylaş, Arxivləşdir). Layihə adının sağındakı ulduz favorit keçididir — klik boş `☆` və dolu `★` vəziyyətini dəyişir.</li>
        <li><b>Axtarış sol rail-dədir.</b> Top bar yoxdur; ⌘K / klik → cmdk command palette.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="state-tag">03b</span><h3>Layihə ikonu — emoji picker</h3>
        <span class="purpose">İkon klik → axtarış / kateqoriya / emoji grid</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="project-icon"></svg>
      <ul class="state-notes">
        <li><b>Emoji picker.</b> İkon klik → popover; axtarış və kateqoriya (Smileys / Objects / Symbols).</li>
        <li><b>Seçim.</b> Emoji klik → ikon dərhal dəyişir; “Sil” ikonu çıxarır.</li>
        <li><b>Klaviatura.</b> Oxlar, Enter, Esc; picker bağlananda fokus ikona qayıdır.</li>
      </ul>
    </figure>

    <figure>
      <div class="frame-head"><span class="state-tag">03c</span><h3>Layihə — Resources tabı</h3>
        <span class="purpose">Header yoxdur · tabs · resurs kart şəbəkəsi</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="project-resources"></svg>
      <ul class="state-notes">
        <li><b>Header təkrarlanmır.</b> Cover, ikon, ad, status chipləri və komanda sətri yalnız Overview-dadır; bu tabda breadcrumb, tabs, məzmun və sağ rels qalır — məzmun dərhal tabs-altından başlayır.</li>
        <li><b>Siyahı deyil, kart şəbəkəsi.</b> Asset-library modeli: hər resurs öz “preview” sahəsi olan kartdır; tip filtri və axtarış yuxarıda qalır.</li>
        <li><b>Preview tipi açmadan oxunur.</b> Sənəd — mətn sətirləri, use case — nömrəli addımlar, data dictionary — mini cədvəl. Tip badge-i bunu təkrarlayır.</li>
        <li><b>Boş yer “yeni resurs” kartı ilə doldurulur.</b> Yaradma əməliyyatı siyahıdan çıxmır; kart həm də boş vəziyyəti göstərir. Hover-də “⋯” action-ları açılır.</li>
        <li><b>Progress zolağı yoxdur.</b> Bu tab resurs kitabxanasıdır, icra paneli deyil; 46% / milestone Overview və Works-də qalır, burada yer kart şəbəkəsinə verilir.</li>
        <li><b>Tab sətrinin sağ sonunda view action-ları.</b> Filter, display options (sıxlıq/görünüş) və sağ paneli yığan (collapse) ikon düymələri — Overview-da yoxdur, çünki orada header və progress bloku tam eni tutur. Üçü də header-dəki “···” menyu düyməsinin sağı ilə eyni xətdədir.</li>
      </ul>
    </figure>

    <figure>
      <div class="frame-head"><span class="state-tag">03d</span><h3>Layihə — Works tabı</h3>
        <span class="purpose">Header yoxdur · tabs · work items siyahısı</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="project-works"></svg>
      <ul class="state-notes">
        <li><b>Header təkrarlanmır.</b> Cover, ikon, ad, status chipləri və komanda sətri yalnız Overview-dadır; Works tabı breadcrumb + tabs ilə başlayır.</li>
        <li><b>Work items siyahısı.</b> Status, məsul və tarix bir sətirdə; filtr yuxarıda.</li>
        <li><b>Board redizaynı sonra planlanır.</b> Works tabı kompakt siyahı göstərir; board və work item detalı bu dəstdən çıxarılıb.</li>
        <li><b>View action-ları tabs sətrinin sağ sonunda.</b> Filter, display options və sağ paneli yığan ikon düymələri hər iki məzmun tabında eyni yerdədir; sağ rels və ikonlar “···” menyu düyməsinin sağı ilə hizalanır, məzmun kartı da həmin sütuna qədər genişlənir; sağ panel yığılanda məzmun tam enə keçir.</li>
      </ul>
    </figure>

<script>
/* 02 Projects — inline frames: layihə icmalı, resurslar, works */
(function () {
  'use strict';
  var WF = window.WF, C = WF.C;
  var frames = WF.frames;

  /* layihə sətri — emoji ikon header-dəki layihə ikonu ilə eynidir */
  function projRow(f, x, y, icon, label, o) {
    o = o || {};
    f.rrect(x, y - 12, 16, 16, 4, { fill: C.white, stroke: C.line, sw: 1, rough: 0.7 });
    f.text(x + 8, y, icon, { size: 11, anchor: 'middle' });
    f.text(x + 24, y, label, { size: o.size || 12.5, weight: o.weight, color: o.color || C.ink2 });
  }

  /* shared project context sidebar (nested tree) */
  function projectSidebar(f) {
    f.line(324, 0, 324, WF.H, { color: C.line, sw: 1.2 });
    f.text(100, 48, 'Layihələr', { size: 15, weight: 700 });
    f.rrect(288, 32, 24, 24, 5, { fill: C.fill, stroke: C.line, rough: 0.7 });
    f.text(300, 50, '+', { size: 15, anchor: 'middle' });

    f.line(112, 92, 112, 260, { color: C.line, sw: 1, dash: [2, 4] });
    f.line(128, 126, 128, 192, { color: C.line, sw: 1, dash: [2, 4] });
    f.rrect(88, 94, 224, 30, 5, { fill: C.fill2, stroke: 'none', rough: 0.6 });

    f.chev(96, 76, 'down', 5);
    f.text(108, 81, 'Departament OS', { size: 13.5, weight: 700 });
    projRow(f, 116, 115, '💳', 'Ödəniş gateway', { size: 13, weight: 700, color: C.ink });
    projRow(f, 132, 149, '🔒', '3DS inteqrasiyası');
    projRow(f, 132, 183, '📊', 'Risk modeli');
    projRow(f, 116, 217, '🧭', 'Onboarding revamp');
    projRow(f, 116, 251, '🗂️', 'Data platform');

    f.chev(96, 300, 'right', 5);
    f.text(108, 305, 'Arxiv (4)', { size: 12.5, color: C.faint });
    f.rrect(100, 700, 200, 36, 5, { fill: 'none', stroke: C.line, dash: [5, 4], rough: 0.8 });
    f.text(200, 723, '+ Yeni layihə', { size: 12.5, anchor: 'middle', color: C.ink2 });
  }

  /* Resources tab — project header yoxdur, tabs + kart şəbəkəsi */
  function projectResources(f, top) {
    f.card(348, top, 728, 670, 'Resurslar');
    f.input(368, top + 40, 200, 'Resurs axtar…', { h: 30 });
    f.chip(580, top + 42, 'Hamısı', { active: true, h: 26, w: 64, size: 10.5 });
    f.chip(652, top + 42, 'Sənəd', { h: 26, w: 56, size: 10.5 });
    f.chip(716, top + 42, 'Use case', { h: 26, w: 74, size: 10.5 });
    f.chip(798, top + 42, 'Data dict.', { h: 26, w: 84, size: 10.5 });
    f.text(1056, top + 59, '5 resurs', { size: 10.5, color: C.faint, anchor: 'end' });
    f.line(368, top + 84, 1056, top + 84, { color: C.line, sw: 1, dash: [4, 5] });

    /* asset-library kartları: preview + tip + sahib + yenilənmə */
    var cards = [
      ['Sənəd', 'doc', 'Ödəniş axını — ümumi baxış', 'SƏ', 'S. Əliyeva', '3 gün'],
      ['Use case', 'uc', 'UC-04 · Refund axını', 'SƏ', 'S. Əliyeva', '3 gün'],
      ['Data dict.', 'dd', 'payment_tx', 'AM', 'A. Məmmədov', '5 gün'],
      ['Sənəd', 'doc', 'Refund siyasəti', 'SƏ', 'S. Əliyeva', '1 həftə'],
      ['Data dict.', 'dd', 'refund', 'RQ', 'R. Quliyev', '2 həftə']
    ];
    var bw = { 'Sənəd': 44, 'Use case': 60, 'Data dict.': 64 };
    cards.forEach(function (c, i) {
      var x = 368 + (i % 3) * 236, y = top + 100 + Math.floor(i / 3) * 286;
      f.rrect(x, y, 216, 262, 6, { fill: C.white });
      f.rrect(x + 1, y + 1, 214, 160, 5, { fill: C.fill2, stroke: 'none', rough: 0.6 });
      f.line(x + 1, y + 161, x + 215, y + 161, { color: C.line, sw: 1 });

      if (c[1] === 'doc') {
        f.line(x + 10, y + 66, x + 74, y + 66, { color: C.ink2, sw: 1.8 });
        f.plines(x + 10, y + 88, 184, 4, 14, { color: C.faint, sw: 1.2 });
      } else if (c[1] === 'uc') {
        [0, 1, 2, 3].forEach(function (j) {
          f.text(x + 11, y + 78 + j * 16, String(j + 1) + '.', { size: 9, color: C.faint });
          f.pline(x + 24, y + 76 + j * 16, 174, { color: C.faint, sw: 1.2 });
        });
      } else {
        [78, 92, 106].forEach(function (ly) {
          f.line(x + 10, y + ly, x + 196, y + ly, { color: C.faint, sw: 1.1 });
        });
        [72, 148].forEach(function (lx) {
          f.line(x + lx, y + 64, x + lx, y + 116, { color: C.faint, sw: 1.1 });
        });
      }
      f.text(x + 202, y + 23, '⋯', { size: 12, color: C.faint, anchor: 'end' });
      WF.ui.badge(f, x + 10, y + 10, c[0], { h: 18, w: bw[c[0]], fs: 8.5, variant: c[1] === 'uc' ? 'outline' : 'secondary' });
      f.text(x + 12, y + 196, c[2], { size: 12 });
      f.av(x + 18, y + 236, 8, c[3]);
      f.text(x + 30, y + 239, c[4], { size: 9.5, color: C.ink2 });
      f.text(x + 202, y + 239, c[5], { size: 9, color: C.faint, anchor: 'end' });
    });

    /* boş vəziyyət: yaratma kartı şəbəkənin sonunda qalır */
    var cx = 368 + 2 * 236, cy = top + 386;
    f.rrect(cx, cy, 216, 262, 6, { fill: 'none', stroke: C.line, dash: [5, 4], rough: 0.8 });
    f.text(cx + 108, cy + 110, '+', { size: 20, anchor: 'middle', color: C.faint });
    f.text(cx + 108, cy + 140, 'Yeni resurs', { size: 11.5, anchor: 'middle', color: C.ink2 });
    f.text(cx + 108, cy + 158, 'Sənəd · use case · data dict.', { size: 8.5, anchor: 'middle', color: C.faint });
  }

  /* Tabs sətrinin sağ sonu — Overview-dan başqa tablarda view action-ları:
     filter · display options · sağ paneli yığ (collapse). */
  function tabRowActions(f, y) {
    /* sağ kənar = header-dəki "···" menyu düyməsinin sağı = sağ relsin sağı */
    var s = 28, gap = 6, right = 1408;
    var cx = right - s;                       /* sağ paneli yığ — ən sağda */

    f.rrect(cx, y, s, s, 6, { fill: 'none', stroke: C.line, sw: 1.1, rough: 0.7 });
    /* panel konturu + sağ divider + sağa ox — paneli kənara yığmaq */
    f.rrect(cx + 6, y + 8, 12, 12, 2, { fill: 'none', stroke: C.ink2, sw: 1.1, rough: 0.5 });
    f.line(cx + 14, y + 8, cx + 14, y + 20, { color: C.ink2, sw: 1.1 });
    f.chev(cx + 22, y + 14, 'right', 3.2);

    cx -= s + gap;                            /* display options — sliders */
    f.rrect(cx, y, s, s, 6, { fill: 'none', stroke: C.line, sw: 1.1, rough: 0.7 });
    [[9, 12], [14, 18], [19, 10]].forEach(function (r) {
      f.line(cx + 7, y + r[0], cx + 21, y + r[0], { color: C.ink2, sw: 1.1 });
      f.dot(cx + r[1], y + r[0], 2.4, C.ink);
    });

    cx -= s + gap;                            /* filter — Lucide "list-filter" */
    f.rrect(cx, y, s, s, 6, { fill: 'none', stroke: C.line, sw: 1.1, rough: 0.7 });
    f.line(cx + 6, y + 9, cx + 22, y + 9, { color: C.ink2, sw: 1.2 });
    f.line(cx + 9, y + 14, cx + 19, y + 14, { color: C.ink2, sw: 1.2 });
    f.line(cx + 11.5, y + 19, cx + 16.5, y + 19, { color: C.ink2, sw: 1.2 });
  }

  /* Works tab — project header yoxdur, tabs + work items siyahısı */
  function projectWorks(f, top) {
    f.card(348, top, 728, 670, 'Work items', 'Hamısı →');
    f.chip(368, top + 40, 'Hamısı', { active: true, h: 26, w: 70, size: 10.5 });
    f.chip(446, top + 40, 'Mənim', { h: 26, w: 64, size: 10.5 });
    f.chip(518, top + 40, 'Bug', { h: 26, w: 54, size: 10.5 });
    f.chip(580, top + 40, 'Bu həftə', { h: 26, w: 80, size: 10.5 });
    f.line(368, top + 84, 1056, top + 84, { color: C.line, sw: 1, dash: [4, 5] });

    [
      ['ACB-160', 'Refund API kontraktı', 'Todo', 'outline', 'BA', 'B. Ağazadə', '30 okt'],
      ['ACB-142', '3DS redirect döngüsü', 'İcrada', 'default', 'SƏ', 'S. Əliyeva', '2 noy'],
      ['ACB-155', 'Webhook imzası', 'Todo', 'outline', 'EC', 'E. Cəfərova', '1 noy'],
      ['ACB-151', 'Risk skorlaması', 'Review', 'secondary', 'NH', 'N. Həsənli', '4 noy'],
      ['ACB-133', 'payment_tx sxemi', 'Bitdi', 'secondary', 'AM', 'A. Məmmədov', '28 okt']
    ].forEach(function (r, i) {
      var y = top + 124 + i * 92;
      f.text(368, y, r[0], { size: 10.5, color: C.faint });
      f.text(440, y, r[1], { size: 12.5 });
      WF.ui.badge(f, 828, y - 13, r[2], { h: 20, w: r[2] === 'İcrada' ? 62 : 58, fs: 9.5, variant: r[3] });
      f.av(938, y - 4, 9, r[4]);
      f.text(956, y, r[5], { size: 10.5, color: C.ink2 });
      f.text(1056, y, r[6], { size: 10, color: C.faint, anchor: 'end' });
      if (i < 4) f.line(368, y + 40, 1056, y + 40, { color: C.line, sw: 1, dash: [4, 5] });
    });
    f.text(368, top + 640, '18 iş · 8 açıq', { size: 10.5, color: C.faint });
  }

  /* ========================= 3. LAYİHƏ İCMALI ========================= */
  function projectView(f, editing, picker, tab, view) {
    tab = tab || 0;
    view = view || 'overview';
    WF.shell(f, { crumb: 'Layihələr', active: 1, header: false });
    projectSidebar(f);

    /* breadcrumb row — page padding + project actions (tab adı təkrarlanmır) */
    var crumb = 'Layihələr / Ödəniş gateway';
    f.text(348, 30, crumb, { size: 12, color: C.faint });
    /* layihə adının sağında favorit ulduzu — boş ☆ / dolu ★ vəziyyəti var */
    f.text(348 + WF.tw(crumb, 12) + 4, 30, '☆', { size: 14, color: C.ink2 });
    f.btn(1236, 16, 132, 'Work item yarat', { kind: 'primary', h: 28, size: 11.5 });
    f.rrect(1380, 16, 28, 28, 6, { fill: 'none', stroke: C.line, sw: 1.1, rough: 0.7 });
    f.text(1394, 35, '···', { size: 14, color: C.ink2, anchor: 'middle' });

    /* layihə headeri (cover, ikon, ad, status, komanda) — yalnız Overview tabında */
    if (view === 'overview') {
      f.rect(324, 50, 1116, 100, { fill: C.fill2, stroke: C.line, rough: 0.8 });
      f.text(1360, 74, 'Sil', { size: 10.5, color: C.faint, anchor: 'end' });
      f.text(1424, 74, 'Dəyişdir', { size: 10.5, color: C.accent, weight: 700, anchor: 'end' });
    }

    /* tabs — hər tabda eyni yerdə: cover-in üst hissəsi, 16px daxili padding */
    WF.ui.tabs(f, 340, 66, ['Overview', 'Resources', 'Works'], tab, { itemPad: 16 });

    /* view action-ları yalnız Overview-dan başqa tablarda — tabs sətrinin sağ sonunda */
    if (view !== 'overview') tabRowActions(f, 70);

    if (view === 'overview') {
      f.rrect(348, 130, 40, 40, 8, { fill: C.white, stroke: C.line, rough: 0.7 });
      f.text(368, 156, '💳', { size: 18, anchor: 'middle' });

      f.text(348, 230, 'Ödəniş gateway', { size: 30, weight: 700 });
      WF.ui.badge(f, 596, 208, 'Aktiv', { h: 26, w: 70, fs: 11.5, variant: 'secondary' });
      WF.ui.badge(f, 678, 208, 'Sağlam', { h: 26, w: 64, fs: 11.5, variant: 'outline' });

      /* properties row — owner, lead, members, freshness */
      f.av(356, 270, 10, 'AM');
      f.text(372, 275, 'Owner · A. Məmmədov', { size: 12.5, color: C.ink2 });
      f.av(566, 270, 10, 'SƏ');
      f.text(582, 275, 'Lead · S. Əliyeva', { size: 12.5, color: C.ink2 });
      var teamEnd = WF.ui.avatarGroup(f, 710, 270, ['AM', 'SƏ', 'BA', 'NH', 'RQ'], 10);
      f.text(teamEnd + 12, 275, '12 üzv', { size: 12.5, color: C.ink2 });
      f.text(880, 275, 'Yenilənib 2 saat əvvəl', { size: 12, color: C.faint });
    }

    /* pulse strip — progress, metrics, next milestone: yalnız Overview-də */
    if (view === 'overview') {
      f.rrect(348, 348, 728, 88, 8, { fill: C.fill, stroke: C.line, rough: 0.8 });
      f.text(368, 370, 'PROGRESS', { size: 9.5, weight: 700, color: C.faint, ls: 1.2 });
      WF.ui.progress(f, 368, 380, 260, 0.46, { h: 8 });
      f.text(636, 386, '46%', { size: 11.5, color: C.ink2 });
      f.text(368, 408, '8 açıq · 0 bloklanmış · 14 bitmiş', { size: 11.5, color: C.ink2 });
      f.line(680, 362, 680, 430, { color: C.line, sw: 1, dash: [3, 4] });
      f.text(704, 370, 'NÖVBƏTİ MILESTONE', { size: 9.5, weight: 700, color: C.faint, ls: 1.2 });
      f.text(704, 394, '3DS keçidi', { size: 13.5, weight: 700 });
      f.text(704, 416, '5 noy · 7 gün qalıb', { size: 11.5, color: C.ink2 });
      f.text(1056, 394, 'Bax →', { size: 11.5, color: C.accent, weight: 700, anchor: 'end' });
    }

    if (view === 'overview') {
    /* about the project — inline editing (Linear model) */
    if (editing) {
      f.card(348, 460, 728, 150, 'Layihə haqqında');
      f.text(1056, 486, 'Yadda saxlanılır… · 800ms', { size: 11, color: C.ink2, anchor: 'end' });
      [['B', 368], ['I', 398], ['↗', 428], ['≡', 458]].forEach(function (t) {
        f.rrect(t[1], 500, 24, 20, 4, { fill: C.white, stroke: C.line, sw: 1, rough: 0.6 });

      });
      f.rrect(368, 526, 678, 52, 5, { fill: C.white, stroke: C.ink, sw: 1.1, rough: 0 });
      f.text(380, 548, '3DS 2.0 keçidi və refund axınının', { size: 12.5, color: C.ink2 });
      f.text(380, 566, 'modernləşdirilməsi.', { size: 12.5, color: C.ink2 });

      f.card(348, 460, 728, 140, 'Layihə haqqında');
      f.plines(368, 512, 678, 3, 20);

    var altY = editing ? 634 : 624;
    var altH = editing ? 190 : 196;

     ['Risk modeli', 0.30, '5 açıq iş', ['RQ', 'AM', 'EC'], 722]].forEach(function (p) {
      var bx = p[4], by = altY + 38;
      f.rrect(bx, by, 334, 142, 5, { fill: C.fill, stroke: C.line, rough: 0.8 });
      f.text(bx + 16, by + 28, p[0], { size: 13.5, weight: 700 });
      WF.ui.progress(f, bx + 16, by + 44, 302, p[1], { h: 8 });
      f.text(bx + 16, by + 74, p[2], { size: 11.5, color: C.ink2 });
      f.avstack(bx + 16, by + 106, p[3], 10);
    });
    } else if (view === 'resources') {
      projectResources(f, 126);
    } else {
      projectWorks(f, 126);
    }

    /* right rail — grouped activity + resources; sağ kənar header-in "···" düyməsi ilə eyni */
    var rt = view === 'overview' ? 200 : 126;
    var rx = 1100, rw = 308;                   /* 1100 + 308 = 1408 */

    /* --- fəaliyyət kartı: resurslar kartı ilə eyni anatomiya --- */
    f.rrect(rx, rt, rw, 356, 6, { fill: C.white });
    f.text(rx + 24, rt + 32, 'Fəaliyyət', { size: 15, weight: 700 });
    f.chip(rx + 104, rt + 19, 'v12', { h: 20, w: 36, size: 10 });
    f.text(rx + 284, rt + 30, 'Hamısı →', { size: 11, color: C.accent, weight: 700, anchor: 'end' });
    f.chip(rx + 24, rt + 54, 'Hamısı', { active: true, h: 22, w: 60, size: 10 });
    f.chip(rx + 92, rt + 54, 'İşlər', { h: 22, w: 50, size: 10 });
    f.chip(rx + 150, rt + 54, 'Resurslar', { h: 22, w: 72, size: 10 });

    f.text(rx + 24, rt + 94, 'BU GÜN', { size: 9.5, weight: 700, color: C.faint, ls: 1.2 });
    f.text(rx + 24, rt + 178, 'DÜNƏN', { size: 9.5, weight: 700, color: C.faint, ls: 1.2 });
    f.text(rx + 24, rt + 262, '2 GÜN ƏVVƏL', { size: 9.5, weight: 700, color: C.faint, ls: 1.2 });

    var act = [
      [112, 'SƏ', 'ACB-142 → İcrada', '2 saat əvvəl'],
      [146, 'BA', 'İcmal yeniləndi (v4)', '4 saat əvvəl'],
      [196, 'RQ', 'Yeni resurs: UC-04', 'dünən'],
      [230, 'AM', 'Milestone: 3DS keçidi', 'dünən'],
      [280, 'NH', 'ACB-151-ə şərh', '2 gün əvvəl'],
      [314, '··', 'Versiya 12 snapshot', '2 gün əvvəl']
    ];
    act.forEach(function (a) {
      f.av(rx + 30, rt + a[0], 11, a[1]);
      f.text(rx + 50, rt + a[0] + 4, a[2], { size: 12.5 });
      f.text(rx + 50, rt + a[0] + 20, a[3], { size: 10.5, color: C.faint });
    });

    /* --- resurslar kartı: eyni başlıq anatomiyası, divider yoxdur ---
       Resurslar tabı aktiv olanda kart gizlədilir — məlumat təkrar olunur.
       Tip bölgüsü (sənəd/use case/data dict.) sabit olmadığı üçün göstərilmir. */
    if (view !== 'resources') {
      var rc = rt + 372;
      f.rrect(rx, rc, rw, 152, 6, { fill: C.white });
      f.text(rx + 24, rc + 32, 'Resurslar', { size: 15, weight: 700 });
      f.text(rx + 96, rc + 31, '15', { size: 11, weight: 600, color: C.faint });
      f.text(rx + 284, rc + 30, 'Hamısı →', { size: 11, color: C.accent, weight: 700, anchor: 'end' });

      /* son əlavə edilən resurs — preview + meta */
      f.rrect(rx + 24, rc + 52, 36, 36, 5, { fill: C.fill2, stroke: C.line, sw: 1, rough: 0.7 });
      f.plines(rx + 30, rc + 62, 24, 3, 7, { color: C.faint, sw: 1.2 });
      f.text(rx + 70, rc + 66, 'UC-04 · Refund axını', { size: 11.5 });
      f.text(rx + 70, rc + 82, 'Use case · S. Əliyeva · 3 gün', { size: 9.5, color: C.faint });

      /* yaratma action-u — kartın altında, dashed */
      f.rrect(rx + 24, rc + 100, 260, 32, 6, { fill: 'none', stroke: C.line, dash: [5, 4], rough: 0.8 });
      f.text(rx + 154, rc + 120, '+ Yeni resurs', { size: 11, color: C.ink2, anchor: 'middle' });
    }

    /* icon picker overlay */
    if (picker === 'icon') {
      f.rrect(348, 178, 300, 292, 8, { fill: C.white, stroke: C.line, rough: 0.8 });
      f.text(368, 206, 'İkon seç', { size: 14, weight: 700 });
      f.text(628, 206, '×', { size: 18, color: C.ink2, anchor: 'end' });
      f.input(368, 222, 260, 'Axtar…', { h: 30 });
      f.chip(368, 266, 'Smileys', { h: 22, w: 70, size: 10 });
      f.chip(446, 266, 'Objects', { active: true, h: 22, w: 70, size: 10 });
      f.chip(524, 266, 'Symbols', { h: 22, w: 70, size: 10 });
      var emojis = ['💳', '🚀', '📦', '⚙️', '✅', '🔥', '📌', '🎯',
                    '💡', '🧩', '🛠️', '📊', '🔒', '🌍', '🧪', '📝',
                    '📚', '🗂️', '📈', '🧭', '🏦', '💸', '🧾', '🛡️',
                    '⚡', '🎨', '🧠', '🔔', '📎', '🗓️', '🧱', '🔖'];
      emojis.forEach(function (e, i) {
        var ex = 368 + (i % 8) * 32, ey = 296 + Math.floor(i / 8) * 32;
        if (i === 0) f.rrect(ex, ey, 28, 28, 6, { fill: C.fill, stroke: C.ink, sw: 1, rough: 0.6 });
        f.text(ex + 16, ey + 21, e, { size: 16, anchor: 'middle' });
      });
      f.text(368, 444, 'Sil', { size: 11.5, color: C.accent, weight: 700 });
      f.text(628, 444, 'Esc', { size: 10.5, color: C.faint, anchor: 'end' });
    }

    if (!editing && !picker && view === 'overview') {
      f.anno(1, 88, 81);
      f.anno(2, 532, 248, 556, 268);
      f.anno(3, 1088, 540, 1054, 640);
      f.anno(4, 1088, 154, 1272, 222);
      f.annoS(5, 772, 196);
      f.annoS(6, 1088, 674);
      f.annoS(7, 1048, 480);
      f.annoS(8, 398, 138);
      f.annoS(9, 1012, 84);
      f.annoS(10, 1216, 30);
      f.annoS(11, 66, 76);
    }
  }

  frames.project = function (f) { projectView(f, false, null, 0, 'overview'); };
  frames['project-icon'] = function (f) { projectView(f, false, 'icon', 0, 'overview'); };
  frames['project-resources'] = function (f) { projectView(f, false, null, 1, 'resources'); };
  frames['project-works'] = function (f) { projectView(f, false, null, 2, 'works'); };

})();
</script>
<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: #board, #today, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
