      <span class="sub">mərkəzləşdirilmiş struktur · rough.js + Kalam</span>
    </div>

    <figure>
      <div class="frame-head"><span class="num">00a</span><h3>Xoş gəldin</h3>
        <span class="purpose">Mərkəzdə tək təbrik, tək hərəkət və aşağıda 7 nöqtə — referensin strukturu, rough dilində</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-welcome"></svg>
      <ol class="notes">
        <li><b>Fokus rejimi.</b> Onboarding app shell-dən kənardır: sol rels, top bar və “+ Yarat” yoxdur. Yalnız brend, “sessiyanı saxla” və tək primary hərəkət var.</li>
        <li><b>Struktur referensdən, dil bizimdir.</b> Məzmun mərkəzdə, bir təbrik, bir alt mətn, bir düymə. Vizual dil isə rough.js + Kalam olaraq qalır.</li>
        <li><b>Tək hərəkət.</b> “Başla” yeganə accent elementdir; “sonra davam et” mikro mətn kimi verilir, diqqət bölünmür.</li>
        <li><b>Tərəqqi aşağıdadır.</b> 7 nöqtə addım sayını göstərir, amma yuxarıda progress bar yoxdur — ekran təmiz qalır.</li>
        <li><b>Təbrik şəxsi, amma yüksüz.</b> Adla müraciət və əl çəkməsi smiley var; konfetti və animasiya yoxdur.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00b</span><h3>Səni tanıyaq</h3>
        <span class="purpose">Qısa profil formu: ad, vəzifə, komanda və bir cümlə</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-questions"></svg>
      <ol class="notes">
        <li><b>Qısa profil, uzun forma deyil.</b> Yalnız kataloqda görünəcək məlumat soruşulur: ad, vəzifə, komanda və bir cümlə. HR məlumatları təkrar soruşulmur.</li>
        <li><b>Ad və vəzifə əvvəlcədən doludur.</b> İstifadəçi yalnız təsdiqləyir və ya düzəldir; boş forma yükü yoxdur.</li>
        <li><b>Komanda seçimi kataloqu bağlayır.</b> Seçilmiş komanda profil kartında və “kimə yazmalı” matrisində görünür.</li>
        <li><b>Bir cümləlik təqdimat opsionaldır.</b> Boş buraxıla bilər; sonra profildən əlavə olunur.</li>
        <li><b>“Sonra” formu keçir.</b> Profil natamam olsa da onboarding davam edir; məlumat itmir.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00c</span><h3>Komandan</h3>
        <span class="purpose">Kart yox: böyük mərkəzli avatarlar, bir insan cümləsi və chip-lər</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-team"></svg>
      <ol class="notes">
        <li><b>Buddy açıq zolaqdır.</b> Kart deyil: böyük avatar, ad, chip-lər və birbaşa sitat. “Salam yaz” tək accent hərəkətdir.</li>
        <li><b>Komanda üzvləri kartdan çıxıb.</b> 6 nəfər açıq 3×2 şəbəkədədir; böyük mərkəzli avatar, ad, rol və bir insan cümləsi. Sərhəd yoxdur, yalnız boşluq.</li>
        <li><b>Detallar chip-lərdədir.</b> Komanda, sahə və ritual məlumatı kiçik chip-lərə köçüb; kart içində sətir yığımı yoxdur.</li>
        <li><b>Hover tək üzv-də göstərilib.</b> Elvin-in avatarı accent ring alır və son chip “Salam yaz →” olur; bütün üzvlərə düymə yığılmır.</li>
        <li><b>Presence qəsdən yoxdur.</b> “Bu gün ofisdə / onlayn” statusu yoxdur; siyahı iş ritminə deyil, insana fokuslanır.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00d</span><h3>Ofis və masan</h3>
        <span class="purpose">İzometrik plan; accent yalnız öz masasında və yolda</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-office"></svg>
      <ol class="notes">
        <li><b>İzometrik plan yön göstərir, dekorasiya deyil.</b> Divar, masa və zonalar eyni miqyasdadır; girişdən masaya yol bir baxışda oxunur.</li>
        <li><b>Yalnız öz masası accentdir.</b> Accent tək “SƏN” pinində və yoldadır; digər zonalar neytral qalır.</li>
        <li><b>Yol çəkilir.</b> Giriş → resepsiya → lift → masa ardıcıllığı kəsik xəttlə göstərilir.</li>
        <li><b>Zonalar etiketlidir.</b> Fokus, görüş, sakit otaq, mətbəx və servis ayrı-ayrı oxunur; rəng əvəzinə forma və etiket işlədilir.</li>
        <li><b>Masa kartı əməliyyatlıdır.</b> Sağdakı panel masa nömrəsini, komandanı və “dəyişmək lazımdır?” linkini verir.</li>
        <li><b>Miqyas və orientasiya.</b> Aşağı solda şimal oxu və 5 m miqyas var; plan naviqasiya alətidir.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00e</span><h3>Davranış kodeksi</h3>
        <span class="purpose">4 prinsip və versiyaya bağlı təsdiq</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-conduct"></svg>
      <ol class="notes">
        <li><b>Divar mətni deyil, qərar qaydası.</b> 4 prinsip var; hər birinin altında “praktikada nə deməkdir” yazılıb. Sual/ssenari qəsdən yoxdur — prinsiplər özləri qərar qaydasıdır.</li>
        <li><b>Təsdiq versiyaya bağlanır.</b> “Oxudum və qəbul edirəm” tarix və sənəd versiyası ilə qeyd olunur; sənəd dəyişsə, yenidən təsdiq tələb olunur.</li>
        <li><b>Anonim kanal görünür.</b> HR və Compliance ilə yanaşı anonim müraciət var; qorxu olmadan sual vermək mümkündür.</li>
        <li><b>Accent yalnız qərardadır.</b> Prinsiplər neytraldır; təsdiq düyməsi accentdir.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00f</span><h3>Təhlükəsizlik</h3>
        <span class="purpose">IT audit qaydaları vərdiş kimi: etməli / etməməli, iki birbaşa addım</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-security"></svg>
      <ol class="notes">
        <li><b>Qaydalar vərdiş kimi yazılıb.</b> “Politika” dili yox; hər sətir gündəlik hərəkətdir: kilidlə, yoxla, bildir. Etməli / etməməli ayrılığı sərhədləri konkret verir.</li>
        <li><b>İki addım birbaşa buradadır.</b> MFA və parol meneceri üçün “Qur” düyməsi var; istifadəçi siyahıdan çıxıb başqa yer axtarmır.</li>
        <li><b>Audit şəffafdır.</b> IT auditin nəyə baxdığı (şifrələmə, yeniləmə, giriş jurnalı) əvvəlcədən göstərilir; sürpriz yoxdur.</li>
        <li><b>Hadisə SLA-sı var.</b> 1 saat içində bildiriş və 30 dəqiqəlik helpdesk cavabı; “nə vaxt” sualı qalmır.</li>
        <li><b>Təsdiq qapıdır.</b> 2 addım tamamlanmadan “Təsdiqlə” aktiv olmur; onboarding yarımçıq qapanmır.</li>
        <li><b>Accent yalnız tamamlanmış addımdadır.</b> Boş checkbox neytraldır; tamamlanan addım accent olur və siyahı bir baxışda oxunur.</li>
      </ol>
    </figure>

    <figure>
      <div class="frame-head"><span class="num">00g</span><h3>Dəstək</h3>
        <span class="purpose">Ad + kanal + SLA və My Work OS-ə keçid</span></div>
      <svg class="frame" viewBox="0 0 1440 900" data-frame="onboard-support"></svg>
      <ol class="notes">
        <li><b>Ad + kanal + SLA.</b> Hər dəstək sətri kimə, hansı kanalla və nə qədər müddətə cavab verəcəyini göstərir.</li>
        <li><b>Fəsillərə qayıtmaq olar.</b> Tamamlandıqdan sonra da istənilən fəsil yenidən açılır; məlumat itmir.</li>
        <li><b>Son addım işə keçiddir.</b> “İş masasına keç” birbaşa My Work OS-ə aparır; onboarding ayrı “ölü son” deyil.</li>
        <li><b>Dəstək onboarding-in davamıdır.</b> Son ekran “bitdi” deyil, “kömək hardadır” sualına cavab verir.</li>
      </ol>
    </figure>

/* 00 Onboarding — referensin strukturu, rough.js + Kalam dili */
(function () {
  'use strict';
  var WF = window.WF, C = WF.C, W = WF.W;
  var frames = WF.frames;

  /* ---------- ortaq ---------- */

  function chrome(f, active) {
    f.rrect(40, 30, 26, 26, 7, { fill: C.ink, stroke: C.ink, rough: 0.6 });
    f.text(53, 48, '◈', { size: 12, anchor: 'middle', color: C.white });
    f.text(76, 45, 'ACB Intranet', { size: 12.5, weight: 700 });

    var exit = 'Sessiyanı saxla';
    f.text(1392, 45, exit, { size: 11.5, color: C.faint, anchor: 'end' });
    f.line(1392 - WF.tw(exit, 11.5), 53, 1392, 53, { color: C.line, sw: 1 });

    for (var i = 0; i < 7; i++) {
      var on = i === active - 1;
      f.circle(720 + (i - 3) * 22, 852, on ? 8 : 7, {
        fill: on ? C.accent : 'none',
        stroke: on ? C.accent : C.line,
        sw: 1.2, rough: 0.7
      });
    }
  }

  function head(f, icon, title, sub) {
    icon(f, 720, 108);
    f.text(720, 192, title, { size: 40, weight: 700, anchor: 'middle' });
    if (sub) f.text(720, 224, sub, { size: 14.5, color: C.ink2, anchor: 'middle' });
  }

  function chipRow(f, cx, y, labels, o) {
    o = o || {};
    var fs = o.size || 10, gap = 8;
    var ws = labels.map(function (l) { return WF.tw(l, fs) + 22; });
    var total = ws.reduce(function (a, b) { return a + b; }, 0) + gap * (labels.length - 1);
    var x = cx - total / 2;
    labels.forEach(function (l, i) {
      f.chip(x, y, l, {
        size: fs, h: 22, w: ws[i],
        active: o.active === i
      });
      x += ws[i] + gap;
    });
  }

  function iconSmiley(f, cx, cy) {
    f.circle(cx, cy, 54, { stroke: C.ink, sw: 1.6, rough: 0.8 });
    f.dot(cx - 9, cy - 6, 2.4, C.ink);
    f.dot(cx + 9, cy - 6, 2.4, C.ink);
    f.add(f.rc.path(
      'M' + (cx - 11) + ' ' + (cy + 8) + ' Q' + cx + ' ' + (cy + 19) + ' ' + (cx + 11) + ' ' + (cy + 8),
      { stroke: C.ink, strokeWidth: 1.6, roughness: 0.8, bowing: 0.6 }
    ));
    f.dot(cx + 18, cy + 9, 2, C.accent);
  }

  function iconProfile(f, cx, cy) {
    f.circle(cx, cy - 10, 22, { stroke: C.ink, sw: 1.5, rough: 0.8 });
    f.add(f.rc.path(
      'M' + (cx - 24) + ' ' + (cy + 26) + ' Q' + cx + ' ' + (cy + 2) + ' ' + (cx + 24) + ' ' + (cy + 26),
      { stroke: C.ink, strokeWidth: 1.5, roughness: 0.7, bowing: 0.6 }
    ));
    f.circle(cx + 18, cy + 10, 14, { fill: C.white, stroke: C.accent, sw: 1.2, rough: 0.6 });
    f.line(cx + 14, cy + 10, cx + 22, cy + 10, { color: C.accent, sw: 1.4 });
    f.line(cx + 18, cy + 6, cx + 18, cy + 14, { color: C.accent, sw: 1.4 });
  }

  function iconPeople(f, cx, cy) {
    f.circle(cx - 10, cy - 6, 24, { stroke: C.ink, sw: 1.5, rough: 0.8 });
    f.circle(cx + 12, cy - 3, 16, { stroke: C.faint, sw: 1.3, rough: 0.8 });
    f.line(cx - 22, cy + 17, cx + 2, cy + 17, { color: C.ink, sw: 1.5 });
    f.line(cx + 8, cy + 14, cx + 22, cy + 14, { color: C.faint, sw: 1.2 });
  }

  function iconBuilding(f, cx, cy) {
    f.rect(cx - 26, cy - 24, 52, 48, { stroke: C.ink, sw: 1.5, rough: 0.7 });
    f.rect(cx - 14, cy - 12, 9, 9, { stroke: C.faint, sw: 1.1, rough: 0.6 });
    f.rect(cx + 5, cy - 12, 9, 9, { stroke: C.faint, sw: 1.1, rough: 0.6 });
    f.rect(cx - 14, cy + 3, 9, 9, { stroke: C.faint, sw: 1.1, rough: 0.6 });
    f.rect(cx + 5, cy + 3, 9, 9, { stroke: C.faint, sw: 1.1, rough: 0.6 });
    f.rect(cx - 4, cy + 12, 10, 12, { stroke: C.ink, sw: 1.2, rough: 0.6 });
  }

  function iconDoc(f, cx, cy) {
    f.rect(cx - 22, cy - 26, 44, 52, { stroke: C.ink, sw: 1.5, rough: 0.7 });
    [cy - 10, cy - 2, cy + 6].forEach(function (y) {
      f.line(cx - 12, y, cx + 12, y, { color: C.faint, sw: 1.2 });
    });
    f.circle(cx + 14, cy + 16, 16, { fill: C.white, stroke: C.accent, sw: 1.4, rough: 0.6 });
    f.line(cx + 10, cy + 16, cx + 13, cy + 19, { color: C.accent, sw: 1.6 });
    f.line(cx + 13, cy + 19, cx + 19, cy + 11, { color: C.accent, sw: 1.6 });
  }

  function iconLock(f, cx, cy) {
    f.rrect(cx - 22, cy - 4, 44, 36, 6, { stroke: C.ink, sw: 1.5, rough: 0.7 });
    f.add(f.rc.path(
      'M' + (cx - 13) + ' ' + (cy - 4) + ' L' + (cx - 13) + ' ' + (cy - 16) +
      ' Q' + (cx - 13) + ' ' + (cy - 30) + ' ' + cx + ' ' + (cy - 30) +
      ' Q' + (cx + 13) + ' ' + (cy - 30) + ' ' + (cx + 13) + ' ' + (cy - 16) +
      ' L' + (cx + 13) + ' ' + (cy - 4),
      { stroke: C.ink, strokeWidth: 1.5, roughness: 0.7, bowing: 0.6 }
    ));
    f.dot(cx, cy + 10, 3, C.accent);
    f.line(cx, cy + 12, cx, cy + 20, { color: C.accent, sw: 1.5 });
  }

  function iconLifebuoy(f, cx, cy) {
    f.circle(cx, cy, 54, { stroke: C.ink, sw: 1.5, rough: 0.7 });
    f.circle(cx, cy, 24, { stroke: C.faint, sw: 1.3, rough: 0.7 });
    f.line(cx - 27, cy, cx - 9, cy, { color: C.ink, sw: 1.4 });
    f.line(cx + 9, cy, cx + 27, cy, { color: C.ink, sw: 1.4 });
    f.line(cx, cy - 27, cx, cy - 9, { color: C.ink, sw: 1.4 });
    f.line(cx, cy + 9, cx, cy + 27, { color: C.ink, sw: 1.4 });
  }

  /* ============================= 00a ============================= */

  frames['onboard-welcome'] = function (f) {
    chrome(f, 1);

    iconSmiley(f, 720, 300);
    f.text(720, 392, 'Xoş gəldin, Kamran.', { size: 46, weight: 700, anchor: 'middle' });
    f.line(600, 408, 840, 404, { color: C.accent, sw: 2.2, rough: 0.8 });
    f.text(720, 450, 'Komandaya qoşulduğun üçün təbrik edirik.', { size: 18, color: C.ink2, anchor: 'middle' });
    f.text(720, 478, 'Səni 6 dəqiqədə komanda, ofis və qaydalarla tanış edək.', { size: 14, color: C.ink2, anchor: 'middle' });

    f.btn(620, 522, 200, 'Başla →', { kind: 'primary', h: 46, size: 14 });
    f.text(720, 598, '6 dəq · istənilən addımda dayandıra bilərsən', { size: 11.5, color: C.faint, anchor: 'middle' });
  };

  /* ============================= 00b ============================= */

  frames['onboard-questions'] = function (f) {
    chrome(f, 2);
    head(f, iconProfile, 'Səni tanıyaq',
      'Komanda səni tanısın deyə bir neçə detal.');

    f.rrect(390, 252, 660, 430, 8, { fill: C.white, stroke: C.line, sw: 1.1, rough: 0.7 });
    f.text(420, 286, 'PROFİL · 1 / 3', { size: 10, weight: 700, color: C.accent, ls: 1.4 });
    f.text(420, 330, 'Profilini tamamla', { size: 24, weight: 700 });
    f.text(420, 358, 'Bu məlumat kataloqda və komanda kartında görünəcək.', { size: 12, color: C.ink2 });

    function field(x, y, w, label, value, placeholder) {
      f.text(x, y - 8, label, { size: 9, weight: 700, color: C.faint, ls: 1.1 });
      f.rrect(x, y, w, 40, 5, { fill: C.white, stroke: C.line, sw: 1.1, rough: 0.7 });
      f.text(x + 14, y + 24, value || placeholder, {
        size: value ? 12.5 : 11.5, color: value ? C.ink : C.faint
      });
    }

    field(420, 400, 600, 'AD, SOYAD', 'Kamran Əliyev', '');
    field(420, 470, 290, 'VƏZİFƏ', 'Product Engineer', '');
    field(730, 470, 290, 'KOMANDA', 'Rəqəmsallaşdırma', '');
    f.chev(1000, 490, 'down', 4.5);

    f.text(420, 532, 'BİR CÜMLƏLİK TƏQDİMAT', { size: 9, weight: 700, color: C.faint, ls: 1.1 });
    f.rrect(420, 540, 600, 62, 5, { fill: C.white, stroke: C.line, sw: 1.1, rough: 0.7 });
    f.text(434, 564, 'Nə ilə məşğulsan, nə üçün sənə yazsınlar?', { size: 11.5, color: C.faint });

    f.btn(420, 622, 220, 'Yadda saxla və davam et →', { kind: 'primary', h: 34, size: 11.5 });
    f.text(662, 642, 'Sonra', { size: 11.5, color: C.ink2 });
    f.text(720, 720, 'Sonra: komanda rolu · iş üslubu', { size: 11, color: C.faint, anchor: 'middle' });
  };

  /* ============================= 00c ============================= */

  frames['onboard-team'] = function (f) {
    chrome(f, 3);
    head(f, iconPeople, 'Komandan',
      'Səninlə birbaşa işləyəcəklər — hər nəfər bir cümlə və bir neçə kiçik detalla.');

    /* buddy — açıq zolaq */
    f.av(250, 304, 34, 'NH');
    f.text(306, 272, 'SƏNİ QARŞILAYIR', { size: 9.5, weight: 700, color: C.accent, ls: 1.4 });
    f.text(306, 304, 'Nigar Həsənli', { size: 20, weight: 700 });
    f.text(306, 326, 'Buddy · QA Engineer', { size: 11.5, color: C.ink2 });
    f.text(306, 352, '“İlk gün səni resepsiyada qarşılayacam — heç nəyi tək axtarma.”', {
      size: 12.5, color: C.ink2
    });
    chipRow(f, 380, 362, ['09:15 · resepsiya', '15 dəq'], { size: 9.5 });
    f.btn(1140, 284, 130, 'Salam yaz', { kind: 'primary', h: 36, size: 11.5 });

    f.line(190, 396, 1250, 396, { color: C.line, dash: [4, 6], sw: 1 });

    function member(cx, y, initials, name, role, line, chips, active) {
      if (active) f.circle(cx, y, 74, { stroke: C.accent, sw: 2, rough: 0.7 });
      f.av(cx, y, 32, initials);
      f.text(cx, y + 66, name, { size: 16, weight: 700, anchor: 'middle' });
      f.text(cx, y + 86, role, { size: 11, color: C.ink2, anchor: 'middle' });
      f.text(cx, y + 110, line, { size: 11.5, anchor: 'middle' });
      chipRow(f, cx, y + 124, chips, {
        size: 9.5, active: active ? chips.length - 1 : -1
      });
    }

    member(360, 462, 'AM', 'Anar Məmmədov', 'Rəqəmsallaşdırma rəhbəri',
      'Prioritet ver, büdcəni aç, yolu aç.', ['Rəqəmsallaşdırma', 'Prioritet', 'Büdcə'], false);
    member(720, 462, 'SƏ', 'Sevil Əliyeva', 'Project Lead',
      'Blok olanda birbaşa yaz — birlikdə açarıq.', ['Ödəniş', 'Layihə axını', 'Bloklar'], false);
    member(1080, 462, 'EC', 'Elvin Cəfərov', 'Backend Developer',
      'Kod review-də səbirli; sual çox olsun.', ['Ödəniş', 'Backend', 'Salam yaz →'], true);

     ['CO', 'Compliance', 'Etik sual və anonim müraciət', '24 saat'],
     ['KB', 'Bilik bazası', 'Onboarding kolleksiyası', '24/7']].forEach(function (r, i) {
      var y = 318 + i * 56;
      f.av(346, y, 16, r[0]);
      f.text(372, y - 2, r[1], { size: 12, weight: 700 });
      f.text(372, y + 16, r[2], { size: 10, color: C.ink2 });
      f.text(1116, y + 4, r[3], { size: 9.5, color: C.faint, anchor: 'end' });
      if (i < 4) f.line(324, y + 34, 1116, y + 34, { color: C.line, dash: [3, 6], sw: 1 });
    });

    f.circle(640, 650, 38, { fill: C.accent, stroke: C.accent, sw: 1, rough: 0.5 });
    f.line(629, 651, 637, 659, { color: C.white, sw: 2 });
    f.line(637, 659, 653, 641, { color: C.white, sw: 2 });
    f.text(674, 644, 'Onboarding tamamlandı', { size: 15, weight: 700 });
    f.text(674, 666, '7 addım · təxmini 6 dəq', { size: 10.5, color: C.ink2 });

    f.btn(600, 700, 240, 'İş masasına keç →', { kind: 'primary', h: 44, size: 13 });
    f.text(720, 760, 'Fəsillərə qayıt', { size: 11.5, color: C.ink2, anchor: 'middle' });
  };

})();
</script>
<script>
  /* ---- render every frame ---- */
  document.querySelectorAll('svg[data-frame]').forEach(function (svg) {
    var fn = window.WF.frames[svg.getAttribute('data-frame')];
    if (!fn) { console.warn('missing frame', svg.getAttribute('data-frame')); return; }
    try { fn(new window.WF.Frame(svg)); }
    catch (e) { console.error(svg.getAttribute('data-frame'), e); }
  });

  /* ---- solo mode: 00-onboarding.html#onboard-team, ... ---- */
  (function () {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var svg = document.querySelector('svg[data-frame="' + id + '"]');
    if (!svg) return;
    var fig = svg.closest('figure');
    document.body.classList.add('solo');
    if (fig) fig.classList.add('solo');
  })();
</script>
